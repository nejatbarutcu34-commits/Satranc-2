<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Satranç</title>
<style>
  :root { --s: min(94vw, 62vh, 560px); --bg: #1f1d1b; --panel: #2c2926; --txt: #eee; --acc: #81b64c; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--txt); font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
  .screen { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px; text-align: center; }
  .hidden { display: none !important; }
  h1 { font-size: 2.6rem; margin: 0 0 8px; letter-spacing: 3px; }
  .logo { font-size: 5rem; line-height: 1; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 14px 28px; cursor: pointer; color: #fff; background: #3d3a37; min-width: 220px; }
  button:hover { filter: brightness(1.15); }
  button.primary { background: var(--acc); font-size: 1.25rem; }
  button.ai { background: #4a6fa5; }
  button.danger { background: #b33; min-width: 0; padding: 10px 18px; }
  button:disabled { opacity: .4; cursor: default; }
  .muted { color: #aaa; font-size: .9rem; }
  .spinner { width: 46px; height: 46px; border: 5px solid #444; border-top-color: var(--acc); border-radius: 50%; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* Oyuncu ismi: ana menüde sağ üstte */
  #nameBox { position: fixed; top: 12px; right: 12px; z-index: 5; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 70vw; }
  #nameBtn { min-width: 0; padding: 8px 14px; font-size: .95rem; background: #3d3a37; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #nameInput { font: inherit; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--acc); background: #1a1816; color: #fff; width: 210px; max-width: 100%; }
  #nameMsg { font-size: .8rem; color: #ff7b7b; min-height: 1em; }

  #board { width: var(--s); height: var(--s); display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr)); border-radius: 6px; overflow: hidden; box-shadow: 0 8px 30px #0008; user-select: none; }
  .sq { position: relative; min-width: 0; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .sq.l { background: #f0d9b5; } .sq.d { background: #b58863; }
  .sq.last { box-shadow: inset 0 0 0 100px rgba(255, 235, 59, .38); }
  .sq.sel { box-shadow: inset 0 0 0 100px rgba(80, 200, 80, .45); }
  .sq.check { background: radial-gradient(circle, #ff3b3b 0%, #ff3b3b55 60%, transparent 75%), inherit; }
  .sq.hint::after { content: ''; width: 28%; height: 28%; border-radius: 50%; background: rgba(0, 0, 0, .25); position: absolute; }
  .sq.cap::after { content: ''; position: absolute; inset: 4%; border-radius: 50%; border: calc(var(--s) / 100) solid rgba(0, 0, 0, .3); }
  .pc { font-size: calc(var(--s) / 8 * .8); line-height: 1; z-index: 1; font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "DejaVu Sans", serif; }
  .pc.w { color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000, 0 0 3px #000, 0 1px 1px #000; }
  .pc.b { color: #151515; text-shadow: 0 0 2px rgba(255,255,255,.35); }
  .co { position: absolute; font-size: calc(var(--s) / 50); font-weight: 700; opacity: .7; pointer-events: none; }
  .co.r { top: 2px; left: 3px; } .co.f { bottom: 1px; right: 3px; }
  .sq.l .co { color: #b58863; } .sq.d .co { color: #f0d9b5; }

  @keyframes shake { 0%, 100% { transform: translate(0, 0) rotate(0); } 15% { transform: translate(-3px, 1px) rotate(-8deg); } 30% { transform: translate(3px, -1px) rotate(8deg); } 45% { transform: translate(-3px, -1px) rotate(-6deg); } 60% { transform: translate(3px, 1px) rotate(6deg); } 75% { transform: translate(-2px, 0) rotate(-4deg); } }
  .sq.check .pc { animation: shake .35s infinite; }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 15% { transform: scale(1.15); opacity: 1; } 25% { transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
  #shah { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 20; }
  #shah span { font-size: min(26vw, 150px); font-weight: 900; color: #ff3b3b; letter-spacing: 4px; text-shadow: 0 0 0 #000, 0 4px 0 #7a0000, 0 0 30px rgba(255, 59, 59, .6), 0 6px 24px #000c; -webkit-text-stroke: 2px #fff; animation: pop 2s ease-out forwards; }

  .bar { width: var(--s); display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 4px; font-weight: 600; }
  #oppLabel, #meLabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #oppLabel { font-size: 1.15rem; }
  .bar .right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .score { font-weight: 800; font-size: 1.1rem; min-width: 2.4em; text-align: right; }
  .score.up { color: #5fe35f; } .score.down { color: #ff5a5a; } .score.zero { color: #aaa; }
  #status { min-height: 1.4em; font-weight: 600; }
  .overlay { position: fixed; inset: 0; background: #000a; display: flex; align-items: center; justify-content: center; z-index: 10; }
  .box { background: var(--panel); padding: 26px; border-radius: 14px; display: flex; flex-direction: column; gap: 16px; align-items: center; max-width: 90vw; }
  .promo { display: flex; gap: 10px; }
  .promo button { min-width: 0; font-size: 2.4rem; padding: 6px 14px; background: #f0d9b5; color: #151515; }
</style>
</head>
<body>

<div id="menu" class="screen">
  <div id="nameBox">
    <button id="nameBtn" title="İsmini değiştirmek için dokun">✏️ <span id="nameTxt">Player</span></button>
    <input id="nameInput" class="hidden" maxlength="15" autocomplete="off" spellcheck="false" placeholder="İsmin (3-15 karakter)">
    <div id="nameMsg"></div>
  </div>
  <div class="logo">♞</div>
  <h1>SATRANÇ</h1>
  <button class="primary" id="play">Oyna</button>
  <button class="ai" id="playAi">Yapay Zekaya Karşı</button>
  <button id="quit">Ayrıl</button>
  <div class="muted">Çevrimiçi oyuncu: <span id="online">0</span></div>
</div>

<div id="search" class="screen hidden">
  <div class="spinner"></div>
  <h2>Rakip aranıyor…</h2>
  <div class="muted">Siteyi kullanan başka bir oyuncu bekleniyor.<br>15 saniye içinde kimse bulunamazsa yapay zekayla eşleşirsin.</div>
  <button id="cancel">İptal</button>
</div>

<div id="game" class="screen hidden">
  <div class="bar"><span id="oppLabel">Rakip</span><span class="right"><span id="oppTag" class="muted"></span><span id="oppScore" class="score zero">0</span></span></div>
  <div id="board"></div>
  <div class="bar"><span id="meLabel">Sen</span><span class="right"><span id="meScore" class="score zero">0</span><button class="danger" id="resign">Pes Et</button></span></div>
  <div id="status"></div>
</div>

<div id="bye" class="screen hidden">
  <div class="logo">👋</div>
  <h2>Görüşmek üzere!</h2>
  <div class="muted">Tarayıcı sekmeyi otomatik kapatmadıysa, sekmeyi kendin kapatabilirsin.</div>
  <button id="back">Ana Menü</button>
</div>

<div id="shah" class="hidden"><span>ŞAH!</span></div>
<div id="promoBox" class="overlay hidden"><div class="box"><div>Terfi için taş seç</div><div class="promo" id="promoBtns"></div></div></div>
<div id="resultBox" class="overlay hidden"><div class="box"><h2 id="resultText"></h2><button class="primary" id="toMenu">Ana Menü</button></div></div>

<script src="/chess.js"></script>
<script>
const $ = s => document.querySelector(s);
const GL = { K: '♚', Q: '♛', R: '♜', B: '♝', N: '♞', P: '♟' };
const BOTS = [
  { id: 'peynir', name: 'Eğitimci Peynir', info: 'Asla mat etmez' },
  { id: 'fiko', name: 'Fiko', info: 'Kolay' },
  { id: 'ismail', name: 'İsmail', info: 'Normal' },
  { id: 'fisher', name: 'Bubi Robot Fisher', info: 'En zor' },
];
const NAME_KEY = 'satrancIsim';
const SEARCH_WAIT_MS = 15000; // bu kadar sürede rakip bulunmazsa yapay zeka devreye girer
const myId = (window.crypto && crypto.randomUUID && crypto.randomUUID()) || (Math.random().toString(36).slice(2) + Date.now().toString(36) + Math.random().toString(36).slice(2));
let state, myColor, legalMoves = [], selected = -1, lastMove = null, active = false;
let botMode = false, bot = null, oppName = '', gameToken = 0, searchTimer = null;
let myName = 'Player';

// ---- Puan: yenen taşların değeri (piyon 1, at/fil 3, kale 5, vezir 9) ----
const PTS = { P: 1, N: 3, B: 3, R: 5, Q: 9, K: 0 };
let scoreMe = 0; // benim puanım: yediklerim - yenenlerim
function renderScore() {
  const set = (id, n) => {
    const e = $(id);
    e.className = 'score ' + (n > 0 ? 'up' : n < 0 ? 'down' : 'zero');
    e.textContent = n > 0 ? '⬆️' + n : n < 0 ? '⬇️' + (-n) : '0';
  };
  set('#meScore', scoreMe); set('#oppScore', -scoreMe);
}
// Hamle uygulanmadan ÖNCE çağrılır (state hâlâ eski konum)
function noteCapture(m) {
  const victim = state.board[m.to], piece = state.board[m.from];
  let v = victim ? PTS[victim[1]] : 0;
  if (!victim && piece && piece[1] === 'P' && m.to === state.ep) v = 1; // en passant
  scoreMe += state.turn === myColor ? v : -v;
  renderScore();
}

// ---- İsim ----
const cleanName = v => String(v || '').replace(/[\u0000-\u001f\u007f<>]/g, '').replace(/\s+/g, ' ').trim();
const validName = v => { const n = Array.from(v).length; return n >= 3 && n <= 15; };
try { const s = cleanName(localStorage.getItem(NAME_KEY)); if (validName(s)) myName = s; } catch (e) {}
$('#nameTxt').textContent = myName;

const nameBtn = $('#nameBtn'), nameInput = $('#nameInput'), nameMsg = $('#nameMsg');
function openName() {
  nameBtn.classList.add('hidden'); nameInput.classList.remove('hidden');
  nameInput.value = myName; nameMsg.textContent = '';
  nameInput.focus(); nameInput.select();
}
function closeName(save) {
  if (save) {
    const v = cleanName(nameInput.value);
    if (!validName(v)) { nameMsg.textContent = 'İsim 3-15 karakter arasında olmalı'; nameInput.focus(); return; }
    myName = v;
    try { localStorage.setItem(NAME_KEY, v); } catch (e) {}
    $('#nameTxt').textContent = v;
  }
  nameInput.classList.add('hidden'); nameBtn.classList.remove('hidden'); nameMsg.textContent = '';
}
nameBtn.onclick = openName;
nameInput.onkeydown = e => { if (e.key === 'Enter') closeName(true); else if (e.key === 'Escape') closeName(false); };
nameInput.onblur = () => { if (!nameInput.classList.contains('hidden')) closeName(validName(cleanName(nameInput.value))); };

function show(id) { document.querySelectorAll('.screen').forEach(e => e.classList.toggle('hidden', e.id !== id)); }
function post(path, extra) {
  return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ id: myId }, extra)) });
}

// ---- Yapay zeka (arka planda çalışır, ekran donmaz) ----
let worker = null, pending = null, reqId = 0;
try {
  worker = new Worker('/bot-worker.js');
  worker.onmessage = e => { if (pending && e.data.id === pending.id) { const p = pending; pending = null; p.done(e.data.m); } };
  worker.onerror = () => { worker = null; if (pending) { const p = pending; pending = null; p.done(null); } };
} catch (e) { worker = null; }

function botTurn() {
  const tok = gameToken, t0 = Date.now();
  updateStatus();
  const done = m => {
    const found = m && legalMoves.find(x => x.from === m.from && x.to === m.to && (x.promo || null) === (m.promo || null));
    const mv = found || legalMoves[Math.floor(Math.random() * legalMoves.length)];
    setTimeout(() => { if (tok === gameToken && active && state.turn !== myColor) playLocal(mv); }, Math.max(0, 700 - (Date.now() - t0)));
  };
  if (!worker) return done(null);
  const id = ++reqId;
  pending = { id, done };
  worker.postMessage({ id, state, bot: bot.id });
}

function playLocal(m) {
  const mover = state.turn;
  noteCapture(m);
  state = Chess.apply(state, m); lastMove = m; selected = -1;
  legalMoves = Chess.legal(state);
  render();
  const st = Chess.status(state);
  if (st !== 'playing') return finish(st, st === 'checkmate' ? mover : null);
  updateStatus();
  if (Chess.inCheck(state.board, state.turn)) showShah();
  if (state.turn !== myColor) botTurn();
}

// ---- Oyun başlatma (hem online hem yapay zeka) ----
function beginGame(color, opp, botInfo) {
  clearTimeout(searchTimer);
  gameToken++; pending = null;
  myColor = color; oppName = opp; bot = botInfo || null; botMode = !!botInfo;
  state = Chess.initialState(); legalMoves = Chess.legal(state);
  selected = -1; lastMove = null; active = true;
  scoreMe = 0; renderScore();
  for (const id of ['#resultBox', '#promoBox', '#shah']) $(id).classList.add('hidden');
  const mine = color === 'w' ? 'Beyaz' : 'Siyah', theirs = color === 'w' ? 'Siyah' : 'Beyaz';
  $('#meLabel').textContent = myName + ' (' + mine + ')';
  $('#oppLabel').textContent = (botMode ? '🤖 ' : '') + opp + ' (' + theirs + ')';
  $('#oppTag').textContent = botMode ? bot.info : '';
  $('#resign').disabled = false;
  show('game'); render(); updateStatus();
  if (botMode && state.turn !== myColor) botTurn();
}
function startBotGame(note) {
  const b = BOTS[Math.floor(Math.random() * BOTS.length)];
  beginGame(Math.random() < 0.5 ? 'w' : 'b', b.name, b);
  if (note) $('#status').textContent = note + ' ' + $('#status').textContent;
}

// ---- Sunucu bağlantısı ----
const es = new EventSource('/events?id=' + myId);
// Bağlantı kopup yeniden kurulduğunda sunucu bizi tanımaz; durumu yeniden bildir
es.addEventListener('hello', () => {
  if (botMode && active) return;
  if (active) finish('lost', null);
  else if (!$('#search').classList.contains('hidden')) post('/api/find', { name: myName });
});
es.addEventListener('online', e => { $('#online').textContent = JSON.parse(e.data).count; });
es.addEventListener('start', e => {
  clearTimeout(searchTimer);
  if (botMode && active) { post('/api/resign'); return; } // çok nadir yarış durumu
  const d = JSON.parse(e.data);
  beginGame(d.color, d.opp || 'Player', null);
});
es.addEventListener('move', e => {
  if (botMode) return;
  const d = JSON.parse(e.data);
  const m = legalMoves.find(x => x.from === d.from && x.to === d.to && (x.promo || null) === d.promo);
  if (!m) return;
  noteCapture(m);
  state = Chess.apply(state, m); lastMove = m; selected = -1;
  legalMoves = Chess.legal(state);
  render();
  if (d.status !== 'playing') finish(d.status, d.winner);
  else { updateStatus(); if (Chess.inCheck(state.board, state.turn)) showShah(); }
});

let shahTimer;
function showShah() {
  const box = $('#shah');
  clearTimeout(shahTimer);
  box.classList.add('hidden'); void box.offsetWidth; // animasyonu baştan başlat
  box.classList.remove('hidden');
  shahTimer = setTimeout(() => box.classList.add('hidden'), 2000);
}
es.addEventListener('over', e => { const d = JSON.parse(e.data); finish(d.reason, d.winner); });

function finish(reason, winner) {
  active = false; selected = -1; pending = null; render();
  $('#resign').disabled = true;
  const won = winner === myColor;
  const txt = {
    checkmate: won ? 'Şah mat! Kazandın 🎉' : 'Şah mat! Kaybettin',
    stalemate: 'Pat — berabere',
    draw50: '50 hamle kuralı — berabere',
    insufficient: 'Yetersiz materyal — berabere',
    resign: won ? (botMode ? oppName + ' pes etti. Kazandın 🎉' : 'Rakip pes etti. Kazandın 🎉') : 'Pes ettin. Kaybettin',
    disconnect: 'Rakip bağlantıyı kesti. Kazandın 🎉',
    lost: 'Bağlantın koptu, oyun sona erdi',
  }[reason] || 'Oyun bitti';
  $('#status').textContent = txt;
  $('#resultText').textContent = txt;
  $('#resultBox').classList.remove('hidden');
}

function updateStatus() {
  const mine = state.turn === myColor;
  const chk = Chess.inCheck(state.board, state.turn);
  $('#status').textContent = (chk ? 'Şah! ' : '') + (mine ? 'Sıra sende' : (botMode ? oppName + ' düşünüyor…' : 'Rakibin sırası'));
}

// ---- Tahta ----
function render() {
  const b = $('#board'); b.innerHTML = '';
  const flip = myColor === 'b';
  const kingSq = Chess.inCheck(state.board, state.turn) ? Chess.findKing(state.board, state.turn) : -1;
  const targets = new Set(legalMoves.filter(m => m.from === selected).map(m => m.to));
  for (let vr = 0; vr < 8; vr++) for (let vf = 0; vf < 8; vf++) {
    const r = flip ? 7 - vr : vr, f = flip ? 7 - vf : vf, sq = r * 8 + f;
    const d = document.createElement('div');
    d.className = 'sq ' + ((r + f) % 2 === 0 ? 'l' : 'd');
    if (sq === selected) d.classList.add('sel');
    if (lastMove && (sq === lastMove.from || sq === lastMove.to)) d.classList.add('last');
    if (sq === kingSq) d.classList.add('check');
    if (targets.has(sq)) d.classList.add(state.board[sq] || (state.board[selected] && state.board[selected][1] === 'P' && sq === state.ep) ? 'cap' : 'hint');
    const p = state.board[sq];
    if (p) { const s = document.createElement('span'); s.className = 'pc ' + p[0]; s.textContent = GL[p[1]] + '︎'; d.appendChild(s); }
    if (vf === 0) { const c = document.createElement('span'); c.className = 'co r'; c.textContent = 8 - r; d.appendChild(c); }
    if (vr === 7) { const c = document.createElement('span'); c.className = 'co f'; c.textContent = 'abcdefgh'[f]; d.appendChild(c); }
    d.onclick = () => clickSq(sq);
    b.appendChild(d);
  }
}

function sendMove(from, to, promo) {
  selected = -1;
  if (botMode) {
    const m = legalMoves.find(x => x.from === from && x.to === to && (x.promo || null) === (promo || null));
    if (m) playLocal(m);
  } else {
    post('/api/move', { from, to, promo });
    render();
  }
}

function clickSq(sq) {
  if (!active || state.turn !== myColor) return;
  if (selected >= 0) {
    const c = legalMoves.filter(m => m.from === selected && m.to === sq);
    if (c.length) {
      if (c[0].promo) return askPromo(selected, sq);
      return sendMove(selected, sq);
    }
  }
  const p = state.board[sq];
  selected = p && p[0] === myColor ? sq : -1;
  render();
}

function askPromo(from, to) {
  const box = $('#promoBtns'); box.innerHTML = '';
  for (const t of ['Q', 'R', 'B', 'N']) {
    const b = document.createElement('button');
    b.textContent = GL[t] + '︎';
    b.onclick = () => { $('#promoBox').classList.add('hidden'); sendMove(from, to, t); };
    box.appendChild(b);
  }
  $('#promoBox').classList.remove('hidden');
}

// ---- Menü ----
$('#play').onclick = async () => {
  show('search');
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    if ($('#search').classList.contains('hidden')) return;
    try { await post('/api/cancel'); } catch (e) {}
    if ($('#search').classList.contains('hidden') || active) return;
    startBotGame('Rakip bulunamadı, yapay zekayla eşleştin.');
  }, SEARCH_WAIT_MS);
  try { await post('/api/find', { name: myName }); } catch (e) { clearTimeout(searchTimer); alert('Sunucuya bağlanılamadı.'); show('menu'); }
};
$('#playAi').onclick = () => startBotGame();
$('#cancel').onclick = () => { clearTimeout(searchTimer); post('/api/cancel'); show('menu'); };
$('#resign').onclick = () => {
  if (!active || !confirm('Pes etmek istediğine emin misin?')) return;
  if (botMode) finish('resign', myColor === 'w' ? 'b' : 'w'); else post('/api/resign');
};
$('#toMenu').onclick = () => { $('#resultBox').classList.add('hidden'); show('menu'); };
$('#back').onclick = () => show('menu');
$('#quit').onclick = () => { window.close(); setTimeout(() => show('bye'), 150); };
</script>
</body>
</html>
